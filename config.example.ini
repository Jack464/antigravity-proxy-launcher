# Copy individual values into the settings window, or save as the config path shown there.
# Local proxy examples: http://127.0.0.1:7890 or socks5://127.0.0.1:10808
# Leave executable paths blank to detect Antigravity and keep the proxy client under your control.
UseProxy=true
AutoDetectProxy=true
ProxyUrl=http://127.0.0.1:10808
AntigravityPath=
ProxyClientPath=
StartupTimeoutSeconds=30
